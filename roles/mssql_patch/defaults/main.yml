---
# Configurable knobs for MSSQL patching. Runtime facts are set in tasks.

mssql_execute_patch: false

# Runtime patch metadata (AAP survey / extra vars); validated in tasks/validate.yml.
mssql_kb_id: ""
mssql_sql_product_major_version: ""
mssql_servicing_branch: ""
mssql_target_build: ""
mssql_installer_filename: ""
mssql_installer_sha256: ""
change_ticket_id: ""

mssql_installer_source_location: ""
mssql_installer_pre_staged: false
mssql_require_installer_checksum: true
mssql_staging_dir: 'C:\ProgramData\AAP\mssql_patch\staging'
mssql_evidence_dir: 'C:\ProgramData\AAP\mssql_patch\evidence'

patch_require_explicit_limit: true
patch_unsafe_targets:
  - all
  - "*"
  - mssql_hosts
patching_exception_enabled: false
patching_exception_reference: ""

# Supply patch_serial as Job Template / runtime extra vars. Play-level serial is resolved
# before per-host execution, so host_vars/group_vars values are not applied to it.
patch_serial: 1
patch_location: ""
patch_window: ""
patch_wave: ""

mssql_report_schema_version: 1
mssql_report_write_files: true
# Controller-side report output. /tmp inside an AAP execution environment is ephemeral and is
# discarded when the job ends. Point this at approved persistent storage, or have a later step
# email the files, attach them to ServiceNow, or publish analytics CSVs for Power BI ingestion
# before the job exits.
mssql_report_dir: /tmp/mssql_patch_reports

# Seconds to wait for WinRM to recover after each remediation phase before marking the host UNREACHABLE.
mssql_connectivity_recheck_timeout: 120

mssql_precheck_min_free_disk_mb: 5120
mssql_precheck_soft_free_disk_mb: 10240
mssql_require_sql_agent: false

mssql_sqlcmd_path: sqlcmd

mssql_pre_patch_reboot_mode: if_required
mssql_post_patch_reboot_mode: if_required
mssql_reboot_timeout: 3600
mssql_pre_reboot_delay: 60
mssql_post_reboot_delay: 60
